# Production-style compose: uses the image from the registry so Watchtower
# can pull updates. Replace OWNER/REPO with your GitHub org/repo (lowercase).
#
# Secrets/data (all live on the host, never in the image):
#   - .env              → loaded via env_file (DISCORD_TOKEN, GOOGLE_APPLICATION_CREDENTIALS, etc.)
#   - firebase-credentials.json → mounted read-only; path set in .env as GOOGLE_APPLICATION_CREDENTIALS
#   - ./data            → DB file persists here as ./data/osrs_events.db
#
services:
  osrs-events:
    image: ghcr.io/ainsley2007/osrs-clan-events:latest
    container_name: osrs-events
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/osrs_events.db
    labels:
      - com.centurylinklabs.watchtower.enable=true
